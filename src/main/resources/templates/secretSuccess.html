<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Submitted</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div class="success-container">
    <div class="success-icon">🔐</div>
    <h1>Secret Submitted Successfully!</h1>
    <p>A Link to view your secret has been created.</p>

    <div class="secret-display">
        <div class="secret-input-container">
            <input type="text"
                   class="secret-input"
                   id="secretInput"
                   value=""
                   readonly>
            <button class="copy-button" onclick="copySecret()" id="copyBtn">
                <svg class="copy-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/>
                </svg>
                Copy
            </button>
        </div>
    </div>

    <a href="/" class="back-link">Submit Another Secret</a>
</div>
<script>
    const domain = window.location.origin;
    const path = "{link}";
    const fullUrl = domain + path;
    document.getElementById("secretInput").value = fullUrl;
</script>
<script src="/js/script.js"></script>
</body>
</html>
